version: '3.8'
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - postgres

  lead-service:
    build: ./lead-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres

  policy-service:
    build: ./policy-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres

  renewal-service:
    build: ./renewal-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres

  claims-service:
    build: ./claims-service
    ports:
      - "8085:8085"
    depends_on:
      - postgres

  document-service:
    build: ./document-service
    ports:
      - "8086:8086"
    depends_on:
      - postgres

  customer-service:
    build: ./customer-service
    ports:
      - "8087:8087"
    depends_on:
      - postgres

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - lead-service
      - policy-service

volumes:
  db-data:
